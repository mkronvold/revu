name: publish-images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revu
          POSTGRES_USER: revu
          POSTGRES_PASSWORD: revu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revu -d revu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://revu:revu@127.0.0.1:5432/revu
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: bash ./scripts/db-migrate-url.sh

      - name: Validate workspace
        run: npm run validate

  build-and-publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: revu-api
            dockerfile: apps/api/Dockerfile
            scan_category: revu-api
            build_args: ''
          - image_name: revu-web
            dockerfile: apps/web/Dockerfile
            scan_category: revu-web
            build_args: |-
              VITE_API_BASE_URL=/api/v1
              VITE_COMPANY_NAME=Your Company
              VITE_ENABLE_QUESTION_SET_STATUS=false
              APP_REVISION=${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          pull: true
          # PRs load a single-platform image for local Trivy. Push path keeps SBOM/provenance.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || false }}

      - name: Resolve image ref for scan
        id: scan_ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ fromJSON(steps.meta.outputs.json).tags[0] }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy vulnerability scan (SARIF, report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan_ref.outputs.value }}
          format: sarif
          output: trivy-${{ matrix.scan_category }}.sarif
          exit-code: '0'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scan (JSON artifact)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan_ref.outputs.value }}
          format: json
          output: trivy-${{ matrix.scan_category }}.json
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4.37.6
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.scan_category)) != ''
        with:
          sarif_file: trivy-${{ matrix.scan_category }}.sarif
          category: ${{ matrix.scan_category }}

      - name: Upload Trivy JSON artifact
        uses: actions/upload-artifact@v7
        if: always() && hashFiles(format('trivy-{0}.json', matrix.scan_category)) != ''
        with:
          name: trivy-json-${{ matrix.scan_category }}
          path: trivy-${{ matrix.scan_category }}.json
          if-no-files-found: ignore
          retention-days: 30
